services:
  mongodb:
    image: mongo:7.0
    container_name: s6758_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - s6758_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  s6758_mongo_data:
