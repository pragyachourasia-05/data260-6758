services:
  mongodb:
    image: mongo:7.0
    container_name: s6758_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - s6758_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HW8: Kafka (KRaft, single node). Containers use kafka:19092, host scripts use localhost:9092.
  kafka:
    image: apache/kafka:3.9.2
    container_name: s6758_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # HW8 Part 1 and dead-letter topics (Part 2 topics are created with the CLI)
  kafka-init:
    image: apache/kafka:3.9.2
    container_name: s6758_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in s6758_listing_requests s6758_listing_responses s6758_dead_letter; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1 --bootstrap-server kafka:19092
        done

  listing-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.kafka
    image: s6758-kafka-listing
    container_name: s6758_listing_worker
    command: ["python", "-u", "listing_worker.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  listing-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.kafka
    image: s6758-kafka-listing
    container_name: s6758_listing_api
    command: ["uvicorn", "kafka_api:app", "--host", "0.0.0.0", "--port", "8458"]
    ports:
      - "8458:8458"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PORT: "8458"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      listing-worker:
        condition: service_started
    restart: unless-stopped

volumes:
  s6758_mongo_data:
